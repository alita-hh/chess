<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>朝阳区象棋协会</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="device-frame">
    <div class="device-screen">
      <div id="app" class="app"></div>
      <nav id="tabbar" class="tabbar" aria-label="主导航">
        <button class="tabbar-item" data-tab="home" data-route="#/home">
          <span class="tabbar-icon">🏠</span>
          <span class="tabbar-label">首页</span>
        </button>
        <button class="tabbar-item" data-tab="activities" data-route="#/activities">
          <span class="tabbar-icon">📅</span>
          <span class="tabbar-label">活动</span>
        </button>
        <button class="tabbar-item" data-tab="profile" data-route="#/profile">
          <span class="tabbar-icon">👤</span>
          <span class="tabbar-label">我的</span>
        </button>
      </nav>
    </div>
  </div>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>
  <div id="modal-root" class="modal-root" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
